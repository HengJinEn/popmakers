<!doctype html><html lang="en"><meta charset="utf-8"><title>POP MAKERS browser checks</title><style>body{margin:0;font-family:system-ui}iframe{position:fixed;top:0;left:0;border:0;display:block;height:1000px}#results{white-space:pre-wrap;padding:20px}#summary{padding:20px}</style><h1 id="summary">Running browser checks…</h1><pre id="results"></pre><iframe id="page" src="../index.html" width="1440" title="POP MAKERS test page"></iframe><script>
const frame = document.querySelector('#page');
const results = [];
function check(name, condition, detail='') { results.push({name, pass:!!condition, detail}); document.querySelector('#results').textContent=JSON.stringify(results,null,2); }
function sleep(ms) { return new Promise(resolve=>setTimeout(resolve,ms)); }
async function until(test, timeout=30000) { const start=Date.now(); while(!test()) { if(Date.now()-start>timeout)throw new Error('Timed out'); await sleep(100); } }
frame.addEventListener('load', async()=>{
 try {
  const doc=frame.contentDocument, win=frame.contentWindow;
  doc.documentElement.style.scrollBehavior='auto';
  await until(()=>doc.querySelectorAll('.connector-card').length===6);
  check('Six connector choices generated',doc.querySelectorAll('.connector-card').length===6);
  check('Kit copy uses wooden sticks and removes obsolete materials',doc.querySelector('meta[name="description"]').content.includes('wooden sticks') && !/popsicle|straw/i.test(doc.body.textContent));
  check('Catapult project links to learning section',doc.querySelector('.project-link').getAttribute('href')==='#catapult' && doc.getElementById('catapult').tagName==='SECTION');
  check('All page IDs are unique',new Set(Array.from(doc.querySelectorAll('[id]'),element=>element.id)).size===doc.querySelectorAll('[id]').length);
  check('Energy section includes Malay terms and curriculum reference',doc.querySelector('#catapult [lang="ms"]').textContent==='Tenaga' && doc.querySelectorAll('.energy-stages>li').length===3 && doc.querySelector('.curriculum-note').textContent.includes('7.1.3–7.1.6'));
  check('All interest links point to the supplied form',Array.from(doc.querySelectorAll('[data-kit-link]')).every(link=>link.href==='https://docs.google.com/forms/d/1InZ53ym9HusaL0M9XLohxLxFonYur33ykRySjzgHA8E/' && link.target==='_blank'),doc.querySelectorAll('[data-kit-link]').length+' links');
  for(const width of [375,768,1440]){
   frame.style.width=width+'px'; await sleep(250);
   const viewport=doc.documentElement.clientWidth;
   const offenders=Array.from(doc.querySelectorAll('body *')).filter(element=>{const rect=element.getBoundingClientRect();return rect.width && (rect.right>viewport+2 || rect.left<-2) && !element.closest('.marquee,model-viewer,.sr-only,.svg-library');}).slice(0,10).map(element=>({tag:element.tagName,class:element.className.baseVal||element.className,left:element.getBoundingClientRect().left,right:element.getBoundingClientRect().right}));
   check('No horizontal overflow at '+width+'px',doc.documentElement.scrollWidth<=viewport+1,JSON.stringify({scroll:doc.documentElement.scrollWidth,viewport,offenders}));
  }
  frame.style.width='375px';await sleep(100);
  const toggle=doc.querySelector('.menu-toggle');toggle.click();check('Mobile navigation opens',toggle.getAttribute('aria-expanded')==='true');
  doc.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Escape closes navigation',toggle.getAttribute('aria-expanded')==='false');
  toggle.click();doc.querySelector('#nav-links a').click();check('Anchor closes navigation',toggle.getAttribute('aria-expanded')==='false');
  const details=doc.querySelector('.faq-list details');details.querySelector('summary').click();check('FAQ opens',details.open);details.querySelector('summary').click();check('FAQ closes',!details.open);
  const email=doc.querySelector('#signup-email'),form=doc.querySelector('#signup-form');email.value='invalid';check('Invalid email rejected',!form.checkValidity());email.value='maker@example.com';const oldURL=win.location.href;form.requestSubmit();check('Preview explains no signup happened',doc.querySelector('#signup-status').textContent.includes('haven’t been signed up'));check('Preview does not navigate or send email in URL',win.location.href===oldURL);email.value='';email.dispatchEvent(new win.Event('input',{bubbles:true}));
  check('No inline style/layout overrides needed for app',doc.querySelectorAll('h1').length===1);
  frame.style.width='1440px';await sleep(100);
  const hero=doc.querySelector('#hero-model'),showcase=doc.querySelector('#showcase-model');
  await until(()=>hero.closest('.viewer-shell').dataset.state==='ready');check('Hero renders real GLB in WebGL',hero.loaded===true);
  doc.querySelector('#connectors').scrollIntoView();await until(()=>showcase.closest('.viewer-shell').dataset.state==='ready');
  for(const [index,card] of Array.from(doc.querySelectorAll('.connector-card')).entries()){
   card.click();await until(()=>showcase.closest('.viewer-shell').dataset.state==='ready');
   check('Real model selection '+(index+1)+': '+card.querySelector('strong').textContent,showcase.loaded===true && card.getAttribute('aria-pressed')==='true' && doc.querySelectorAll('.connector-card[aria-pressed="true"]').length===1);
   if(index===5) check('Sixth choice uses Prism GLB and poster',card.querySelector('strong').textContent==='Prism Connector' && showcase.src.includes('Prism%20Connector.glb') && doc.querySelector('#showcase-poster').src.endsWith('/prism.png'));
  }
  const spin=doc.querySelector('#spin-button');
  if(win.matchMedia('(prefers-reduced-motion: reduce)').matches){
   check('Reduced motion disables automatic rotation',!hero.hasAttribute('auto-rotate')&&!showcase.hasAttribute('auto-rotate'));
   spin.click();check('Reduced motion spin remains a single manual turn',!showcase.hasAttribute('auto-rotate') && spin.getAttribute('aria-pressed')==='false');
   check('Reduced motion disables decorative animation',win.getComputedStyle(doc.querySelector('.marquee-track')).animationName==='none');
  }else{spin.click();check('Rotation pauses',!showcase.hasAttribute('auto-rotate'));spin.click();check('Rotation resumes',showcase.hasAttribute('auto-rotate'));}
  const startTheta=showcase.getCameraOrbit().theta;showcase.cameraOrbit=(startTheta*180/Math.PI+90)+'deg 65deg auto';await showcase.updateComplete;showcase.jumpCameraToGoal();await sleep(100);check('Camera orbit can change',Math.abs(showcase.getCameraOrbit().theta-startTheta)>0.1,JSON.stringify({before:startTheta,after:showcase.getCameraOrbit().theta}));
  // Deliberately fail the local model, then verify the retry uses catalog source.
  showcase.src='assets/models/missing-for-error-test.glb';await until(()=>showcase.closest('.viewer-shell').dataset.state==='error');check('Missing GLB displays real static fallback',!showcase.closest('.viewer-shell').querySelector('.viewer-error').hidden && showcase.closest('.viewer-shell').querySelector('.model-poster').complete);
  showcase.closest('.viewer-shell').querySelector('.retry-button').click();await until(()=>showcase.closest('.viewer-shell').dataset.state==='ready');check('Retry restores a working real model',showcase.loaded===true);
  doc.querySelectorAll('.connector-card')[0].click();await until(()=>showcase.closest('.viewer-shell').dataset.state==='ready');
  doc.querySelectorAll('.connector-card')[1].click();doc.querySelectorAll('.connector-card')[4].click();doc.querySelectorAll('.connector-card')[2].click();await until(()=>showcase.closest('.viewer-shell').dataset.state==='ready');check('Rapid selection settles on latest model',showcase.src.includes('360%20Connector.glb'));
  for(const element of doc.querySelectorAll('.reveal')) {element.scrollIntoView({block:'center',behavior:'instant'});await sleep(150);}
  check('All section reveals become visible',doc.querySelectorAll('.is-pending').length===0,Array.from(doc.querySelectorAll('.is-pending')).map(element=>element.className).join(', '));
  doc.querySelector('#connectors').scrollIntoView();await sleep(100);
  check('Page images are valid',Array.from(doc.querySelectorAll('img')).every(image=>image.complete && image.naturalWidth>0));
  check('Supplied catapult photograph loads without cropping',doc.querySelector('.catapult-photo').naturalWidth===960 && doc.querySelector('.catapult-photo').naturalHeight===1280 && win.getComputedStyle(doc.querySelector('.catapult-photo')).objectFit==='contain');
  document.querySelector('#summary').textContent=results.every(result=>result.pass)?'PASS — '+results.length+' browser checks':'FAIL — inspect results';
 }catch(error){const doc=frame.contentDocument,model=doc.querySelector('#showcase-model');check('Browser check runner completed',false,JSON.stringify({error:error.message,state:model.closest('.viewer-shell').dataset.state,src:model.src,rect:model.getBoundingClientRect().toJSON(),scrollY:frame.contentWindow.scrollY,frame:frame.getBoundingClientRect().toJSON(),innerHeight:frame.contentWindow.innerHeight}));document.querySelector('#summary').textContent='FAIL — '+error.message;}
 document.documentElement.dataset.completed='true';
});
</script></html>
